<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07070A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F5F2EC" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Three roles, three families: a high-contrast display serif, a tight grotesque, a mono.
         `display=swap` keeps first paint text visible; the stacks in tailwind.config.js carry
         system fallbacks so an offline dev machine still looks deliberate. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Bebas+Neue&family=Archivo+Black&display=swap"
      rel="stylesheet"
    />

    <title>Aldi Pradana Hakim — Full-Stack Web Developer</title>
    <meta
      name="description"
      content="Portfolio of Aldi Pradana Hakim, a full-stack web developer in Indonesia. Web applications, point-of-sale systems, realtime device tracking, REST APIs and web GIS — each with its real stack and results."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aldi Pradana Hakim — Full-Stack Web Developer" />
    <meta
      property="og:description"
      content="Web applications, point-of-sale systems, realtime device tracking, REST APIs and web GIS — built end to end, from the database schema to the last screen."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Aldi Pradana Hakim — Full-Stack Web Developer" />
    <meta
      name="twitter:description"
      content="Web applications, point-of-sale systems, realtime device tracking, REST APIs and web GIS — built end to end."
    />
    <script>
      /* Applies the stored/system theme before first paint, so there is never a flash of the
         wrong theme. Wrapped so blocked storage or matchMedia cannot throw. */
      (function () {
        try {
          var stored = localStorage.getItem('aldi-theme');
          var light =
            stored === 'light' ||
            (stored !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.classList.toggle('light', light);
        } catch (error) {
          /* storage blocked: the dark default in index.css stands */
        }
      })();
    </script>
    <!-- Boot splash: the name, set in a heavy condensed display face, rising letter by letter out
         of a mask while a hairline fills underneath. Lives outside #root so it paints before the
         bundle exists, and the whole reveal is one 2.4s timeline driven by CSS: no JS is required
         for it to finish, so a bundle that never loads still leaves a usable page. The exit
         collapses to a point and ends on visibility:hidden, and main.tsx removes the node on
         animationend. -->
    <style>
      #boot {
        --t: 2400ms;
        --boot-bg: #07070a;
        --boot-ink: #f3efe7;
        --boot-accent: #ff4a36;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(1.2rem, 3vw, 2rem);
        padding: 8vw;
        background: var(--boot-bg);
        color: var(--boot-ink);
        animation: boot-exit var(--t) linear forwards;
      }

      /* Each word is a line of a single lockup. `overflow: hidden` is the mask the letters rise
         out of; the padding-bottom keeps descenders from being clipped by it. */
      .boot-name {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(0.1rem, 0.6vw, 0.4rem);
        text-align: center;
        font-family: 'Bebas Neue', 'Archivo Black', 'Inter Tight', system-ui, sans-serif;
        font-weight: 400;
        line-height: 0.84;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        font-size: clamp(2.9rem, 12.5vw, 8.5rem);
      }
      .boot-word {
        display: block;
        overflow: hidden;
        padding-bottom: 0.08em;
      }
      .boot-word > span {
        display: block;
        transform: translateY(105%);
        animation: word-rise var(--t) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      /* the second line comes up a beat after the first, and the surname carries the accent */
      .boot-word--2 > span { animation-delay: 90ms; }
      .boot-word--2 { color: var(--boot-accent); }

      /* A hairline that draws itself under the name: enough movement to feel alive without a
         spinner, which would read as "loading" rather than "arriving". */
      .boot-rule {
        position: relative;
        width: clamp(190px, 46vw, 460px);
        height: 1px;
        background: rgb(243 239 231 / 0.14);
        overflow: hidden;
      }
      .boot-rule::after {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--boot-accent);
        transform: scaleX(0);
        transform-origin: left;
        animation: rule-fill var(--t) cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards;
      }

      .boot-role {
        margin: 0;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: clamp(9px, 1.5vw, 11px);
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: rgb(243 239 231 / 0.5);
        opacity: 0;
        animation: role-in var(--t) linear forwards;
      }

      /* 0-14% name rises · 14-78% rule fills · 62-96% role fades up · 96-100% collapse */
      @keyframes word-rise {
        0% { transform: translateY(105%); }
        22%, 100% { transform: translateY(0); }
      }
      @keyframes rule-fill {
        0%, 12% { transform: scaleX(0); }
        78%, 100% { transform: scaleX(1); }
      }
      @keyframes role-in {
        0%, 62% { opacity: 0; }
        80%, 92% { opacity: 1; }
        100% { opacity: 1; }
      }
      @keyframes boot-exit {
        0%, 92% { opacity: 1; visibility: visible; clip-path: circle(150% at 50% 50%); }
        100% {
          opacity: 0;
          visibility: hidden;
          clip-path: circle(0% at 50% 50%);
        }
      }

      /* The site fades and settles in the moment the bundle paints — before the splash collapses —
         so the reveal is the splash's own collapse onto an already-settled page, with no pop.
         Scoped to .boot-ready (added by main.tsx after first paint) so a bundle that never runs can
         never leave the page stuck invisible. `backwards`, not `both`: `both` keeps the final
         transform, and any transform makes the element a containing block for `position: fixed`,
         which pinned the nav pill to the document instead of the viewport. */
      html.boot-ready #root {
        animation: site-in 900ms cubic-bezier(0.22, 1, 0.36, 1) backwards;
      }
      @keyframes site-in {
        from { opacity: 0; transform: scale(1.015); }
        to { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <p class="boot-name">
        <span class="boot-word"><span>Aldi Pradana</span></span>
        <span class="boot-word boot-word--2"><span>Hakim</span></span>
      </p>
      <span class="boot-rule"></span>
      <p class="boot-role">Full-stack web developer</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
